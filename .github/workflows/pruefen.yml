# Automatische Prüfung bei jedem Push und Pull Request:
# Lint, Typprüfung, Logiktests und Next.js-Build.
name: Prüfen

on:
  push:
  pull_request:

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
